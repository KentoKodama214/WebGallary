spring:
  application:
    name: WebGallery
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  tomcat:
    remoteip:
      remote-ip-header: "x-forwarded-for"
      protocol-header: "x-forwarded-proto"

springdoc:
  api-docs:
    path: /v3/api-docs
  scalar:
    path: /scalar

mybatis:
  type-handlers-package: com.web.gallery.type_handler

management:
  add-application-context-header: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36}.%M:%L - %msg%n"

app:
  account:
    accountCountPerPage: 20
  photo:
    photoCountPerPage: 20
    maxFileSizeMb: 5
  s3:
    # 画像ストレージ（S3 / MinIO）。プロファイルごとに endpoint / bucket / 認証情報を上書きする
    region: ${AWS_REGION:ap-northeast-1}
    path-style-access: ${APP_S3_PATH_STYLE_ACCESS:false}
    presign-expiry-seconds: ${APP_S3_PRESIGN_EXPIRY_SECONDS:900}
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpirationMinutes: 15
    refreshTokenExpirationDays: 7
    # ローテーション済みトークンの再送をこの秒数以内なら正常系リトライとみなす（全セッション失効しない）
    refreshTokenReuseGraceSeconds: 30
  rate-limit:
    # 送信元IPごとのエンドポイント別レート制限（前段WAF/LBのレート制限に加えた多層防御）。
    # プロセスローカルのカウンタのため、複数インスタンス構成では実効しきい値がインスタンス数倍になる。
    # IP単位のため共有NAT配下では誤検知しうる。しきい値は環境に応じて調整すること。
    enabled: ${RATE_LIMIT_ENABLED:true}
    # ログイン（総当たり対策で低め。アカウント単位のロックと併用）
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:30}
      window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
    # アカウント登録（スパム対策で低め）
    register:
      capacity: ${RATE_LIMIT_REGISTER_CAPACITY:10}
      window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
    # 上記以外の /api/** リクエスト（トークンリフレッシュ・写真アップロード等を含む）
    general:
      capacity: ${RATE_LIMIT_GENERAL_CAPACITY:300}
      window-seconds: ${RATE_LIMIT_GENERAL_WINDOW_SECONDS:60}

auth:
  login:
    failCount: 3
    lockDurationMinutes: 30
  reauth:
    # 現在のパスワードによる本人確認（再認証）の連続失敗をアカウント単位でインメモリに数え、
    # この回数に達したら lockout-minutes 分ロックアウトする（0以下で無効）
    max-failures: 5
    lockout-minutes: 15
  # JWT認証フィルタのアカウント情報キャッシュTTL（ミリ秒）。0以下でキャッシュ無効
  principal-cache-ttl-millis: 10000
