spring:
  application:
    name: WebGallery
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  mvc:
    # CommonControllerAdviceで処理済みの例外を、フレームワークが重ねてスタックトレース付きで
    # WARNログ出力するのを抑止する（ログ集約基盤へ内部情報を残さない）
    log-resolved-exception: false

server:
  tomcat:
    remoteip:
      remote-ip-header: "x-forwarded-for"
      protocol-header: "x-forwarded-proto"
  # エラーレスポンスから内部情報（例外メッセージ・スタックトレース・バインドエラー詳細・例外クラス名）を
  # 一切出さない。フィルタ内で発生しCommonControllerAdviceで捕捉されない例外（認証フィルタ・
  # レートリミット等）が /error ディスパッチに落ちても内部構造を推測されないようにするための多層防御。
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  scalar:
    path: /scalar

mybatis:
  type-handlers-package: com.web.gallery.type_handler

management:
  add-application-context-header: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36}.%M:%L - %msg%n"

app:
  account:
    accountCountPerPage: 20
  photo:
    photoCountPerPage: 20
    maxFileSizeMb: 5
  s3:
    # 画像ストレージ（S3 / MinIO）。プロファイルごとに endpoint / bucket / 認証情報を上書きする
    region: ${AWS_REGION:ap-northeast-1}
    path-style-access: ${APP_S3_PATH_STYLE_ACCESS:false}
    presign-expiry-seconds: ${APP_S3_PRESIGN_EXPIRY_SECONDS:900}
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpirationMinutes: 15
    refreshTokenExpirationDays: 7
    # ローテーション済みトークンの再送をこの秒数以内なら正常系リトライとみなす（全セッション失効しない）
    refreshTokenReuseGraceSeconds: 30

auth:
  login:
    failCount: 3
    lockDurationMinutes: 30
  reauth:
    # 現在のパスワードによる本人確認（再認証）の連続失敗をアカウント単位でインメモリに数え、
    # この回数に達したら lockout-minutes 分ロックアウトする（0以下で無効）
    max-failures: 5
    lockout-minutes: 15
  # JWT認証フィルタのアカウント情報キャッシュTTL（ミリ秒）。0以下でキャッシュ無効
  principal-cache-ttl-millis: 10000
